spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  config.import: ""

jwt:
  secret: test-secret-key-for-jwt-must-be-at-least-32-bytes-long
kakao:
  client-id: test-client-id
  redirect-uri: http://localhost:8080/api/auth/kakao-login
cloud.aws:
  region.static: ap-northeast-2
  s3.bucket: test-bucket
  s3.default-image-url: http://test.com/default.png
  credentials: { access-key: test, secret-key: test }
  stack.auto: false